name: Bug report
description: Something is not working as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Steps to reproduce, what you expected and what you saw.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Raseel version
      placeholder: e.g. 1.0.0 or commit hash
  - type: dropdown
    id: install
    attributes:
      label: How do you run Raseel?
      options: [install.sh, docker compose (manual), development]
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Output of `docker compose logs api worker`. Remove phone numbers and tokens.
      render: shell
